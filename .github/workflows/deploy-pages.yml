name: Deploy GitHub Pages

# Veröffentlicht den Inhalt von public/ als statische Web-App (HTML-Variante, PWA).
# Die App schaltet ohne Server-API automatisch in den Lokalmodus (Daten bleiben im Browser).

on:
  workflow_dispatch:
  push:
    branches:
      - arena/**
      - main
    paths:
      - 'public/**'
      - '.github/workflows/deploy-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: public/ nach GitHub Pages deployen
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages (aktiviert die Site bei Bedarf selbst)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
